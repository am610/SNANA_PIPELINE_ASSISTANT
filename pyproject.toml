[project]
name = "snana-assistant"
version = "0.1.1"
description = "LLM-based ops assistant for SNANA/Pippin pipelines"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.125.0"]
openai = ["openai>=1.0"]
gemini = ["google-genai"]
all = ["anthropic>=0.125.0", "openai>=1.0", "google-genai"]

[project.scripts]
snana-assistant = "snana_assistant.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"snana_assistant.data" = ["*.yaml", "*.json"]

