- id: sigint-biascor-insufficient-events
  symptom: 'FATAL ERROR ABORT called by init_sigInt_biasCor_SNRCUT with "NUSE too
    small" or quickBinSearch failure when value falls outside expected range. Also
    occurs as "Crazy parval_next(sigint)" with unrealistic parameter values during
    fitting when using narrow mass/redshift bins in SALT2mu with BIASCOR.

    '
  cause: 'Splitting data into narrow mass and redshift bins results in too few high-SNR
    events in BIASCOR sample to reliably compute intrinsic dispersion (sigInt). Numerical
    recipes fail or produce unstable results with ~20 or fewer events, especially
    when bins contain only 2 events. At high redshift, BIASCOR sample lacks high-SNR
    events entirely.

    '
  fix: '1. Widen mass and redshift bins to contain more events (at least 20-30 high-SNR
    events recommended).

    2. Remove problematic bins (e.g., remove 11-12 LOGMASS bin if insufficient events).

    3. Increase simulation size for BIASCOR sample to provide more high-mass/high-redshift
    events.

    4. Force sigInt manually using input parameter: sigint_biascor=0.10 (or appropriate
    value).

    '
