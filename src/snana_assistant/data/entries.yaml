- id: fluxerr-scale-negative-sqrt
  symptom: 'Code aborts when attempting to scale flux errors by factors < 1.0 using
    FLUXERRMODEL_FILE with ERRSCALE values around 0.6. The error involves a square
    root of a negative number during error calculation.

