- id: uv-spectra-truncation-invalid-zp-spectrograph
  symptom: "UV spectra simulation output truncated to wavelengths \u22653600\xC5 instead\
    \ of requested 1800-10000\xC5 range. Program aborts with 'Invalid ZP_SPECTROGRAPH\
    \ frac = 0.335; exceeds FRAC_ZP_INVALID_ABORT=0.020' error when MAGREF_LIST has\
    \ inappropriate faint-end magnitude value (e.g., 32.0), causing ~33% of wavelength\
    \ bins to have ZP<0 and be rejected silently or with abort."
  cause: 'Two interconnected issues: (1) SNR_LAMOBS constraints in SIMLIB TAKE_SPECTRUM
    keys limit output spectrum wavelength range; (2) Invalid ZP_SPECTROGRAPH calculations
    occur when MAGREF_LIST faint-end magnitude is too faint relative to actual SN
    sample, causing negative zero-point values in ~1/3 of wavelength bins. Original
    code rejected these bins without warning, and new validation code aborts if >2%
    of bins fail ZP>0 criterion.'
  fix: Set ZPMIN_SPECTROGRAPH to -10 (instead of 0) in sntools_spectrograph.h to allow
    wavelength bins with slightly negative ZP values. User should also adjust MAGREF_LIST
    faint-end magnitude to be closer to the faint end of SNe passing selection criteria
    (e.g., use 17.0-22.0 instead of 17.0-32.0) to improve ZP_SPECTROGRAPH estimates.
