  status: unverified
  source: 'GitHub Issue #1164'
- id: lambda-range-spectrograph-extension-overflow
  symptom: 'FATAL ERROR in interp_primaryFlux_SEDMODEL: wavelength value (e.g., 12602.8
    A) is outside expected LAMBDA_RANGE (e.g., 12580.0 - 12600.0 A). Program aborts
    with message "lam=12602.8 is outside expected range. Check LAMBDA_RANGE key in
    kcor-input file."

    '
  cause: 'The spectrograph wave range is internally extended based on wave resolution
    to account for wave-smearing near edges. This extension can add an extra wavelength
    bin that exceeds the primary SED range defined in the kcor file, causing interpolation
    to fail at the boundary.

    '
  fix: 'Trim the spectrograph wave range by several tens of Angstroms and remake the
    kcor-input file to ensure the internally-extended spectrograph range does not
    exceed the primary SED wavelength limits. Alternatively, expand the LAMBDA_RANGE
    in the kcor file to accommodate the extended spectrograph range.

    '
