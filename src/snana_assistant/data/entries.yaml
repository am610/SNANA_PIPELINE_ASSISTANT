  cause: SNR calculation was not properly filtering out wavelength bins with unreliable
    flux errors. Bins with FLAMERR/FLAMERR_MEDIAN ratios exceeding a threshold should
    have been excluded but were being included in the computation.
  fix: Implemented automatic exclusion of wavelength bins where FLAMERR/FLAMERR_MEDIAN
    > 50. This threshold is hard-coded but can be made configurable via input parameters
