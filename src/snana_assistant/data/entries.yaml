- id: create-cov-segfault-nested-matrix-ops
  symptom: Segmentation fault in create_covariance.py when performing nested numpy
    matrix operations on large covariance matrices (e.g., 12k x 12k). Error occurs
    at lines with function-of-function patterns like `cov.copy() * 0`, `cov_sys +
    np.diag(...)`, and `np.linalg.norm(np.eye(n) - matrix.dot(...))`
  cause: Nested/chained numpy matrix operations cause segmentation faults, possibly
    due to memory management issues or compiler optimizations in the Python/numpy
    installation. Root cause varies by execution environment but manifests consistently
    with function-of-function matrix operations.
  fix: 'Replace nested matrix operations with explicit intermediate variable assignment.
    Specifically: (1) Replace `final_cov = cov.copy() * 0` with `final_cov = cov.copy()`
    followed by `final_cov *= 0.0`. (2) Replace `effective_cov = cov_sys + np.diag(base[VARNAME_MUERR]**2)`
    with explicit intermediate variable `diag_muerr_cov = np.diag(...)` then `effective_cov
    = cov_sys + diag_muerr_cov`. (3) Replace `np.linalg.norm(np.eye(n) - matrix.dot(...))`
    with intermediate variables `tmp1 = np.eye(n)`, `tmp2 = matrix.dot(...)`, `tmpdif
    = tmp1 - tmp2`, then `error = np.linalg.norm(tmpdif)`.'
  scope: universal
  status: unverified
  source: 'GitHub Issue #1235'
- id: hostlib-ztrue-cmb-column-missing-ztrue-abort
