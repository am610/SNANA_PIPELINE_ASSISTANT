- id: simlib-take-spectrum-snr-outlier-sensitivity
  symptom: SNR computation for TAKE_SPECTRUM keys in SIMLIB output is highly sensitive
    to outliers. Data points with anomalously high errors (e.g., from sky lines or
    data quality issues) can cause SNR values to vary dramatically (e.g., 0.1 vs 553)
