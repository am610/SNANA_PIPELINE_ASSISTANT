- id: negative-memory-allocation-int-overflow
  symptom: 'SNANA attempts to allocate negative memory (e.g., "Allocate -1714.341
    MB memory") during LCFIT stage, causing Bus errors and out-of-memory failures.
    Error appears in FITS file memory allocation logs.

    '
  cause: 'The MEMTOT counter in the malloc function inside sntools_dataformat_fits.c
    was declared as a 32-bit int, causing integer overflow when allocating more than
    2 GB of memory, resulting in negative values. Additionally, large SPEC.FITS files
    in simulation outputs can cause excessive memory allocation (>6 GB), leading to
    out-of-memory conditions.

    '
  fix: '1. Declare MEMTOT as long long (8-byte int) in sntools_dataformat_fits.c to
    prevent integer overflow.

    2. Regenerate simulations without TAKE_SPECTRUM keys to reduce SPEC.FITS file
    size and overall memory requirements.

    '
  scope: universal
  status: unverified
  source: 'GitHub Issue #1690'
- id: searcheff-logic-conditions-exceeded-bounds
  symptom: Crash in readMap_SEARCHEFF_DETECT() with stack trace showing signal handler
    called, resulting in FATAL ERROR when number of SEARCHEFF_PIPELINE_EFF_FILE maps
    exceeds bound of 50
  cause: Number of logic conditions and character limits in sntools_trigger.h and
    sntools_trigger.c were insufficient to handle 54 detection maps (one per filter
    band). No bounds checking existed, causing buffer overflow and crash.
  fix: Increased MXMASK_SEARCHEFF_LOGIC from 10 to 60, MXSUBSTR_SEARCHEFF_MAP from
    4 to 60, INPUT_STRING buffer from 80 to 200 characters in sntools_trigger.h, and
    logic buffer from 100 to 200 characters in sntools_trigger.c init_SEARCHEFF_LOGIC().
    Added bounds checking. Alternatively, users can combine maps and define a single
    map with all filters instead of separate maps per band.
