- id: lcfit-trestmin-trestmax-definition-mismatch
  symptom: 'CUTWIN_TRESTMIN and CUTWIN_TRESTMAX cuts in snlc_fit analysis code sharply
    cut the sample far more than expected. When using cuts like cutwin_Trestmin =
    -10 0 and cutwin_Trestmax = 0 30 with CUTWIN_TREST = -20 60, most SNe are rejected
    despite appearing to have valid observations in the expected rest-frame time windows.

    '
  cause: 'Different definitions of CUTWIN_TRESTMIN[MAX] between simulation code and
    analysis code. The simulation cut applies to any epoch, while snlc_fit analysis
    cut applies to the extreme minimum or maximum rest-frame time within the overall
    CUTWIN_TREST window. This causes observations outside the Trestmin/Trestmax ranges
    but within CUTWIN_TREST to incorrectly fail the cuts.

    '
  fix: 'Use CUTWIN_TRESTMIN and CUTWIN_TRESTMAX to define the full range of expected
    observations by setting them equal to CUTWIN_TREST boundaries (e.g., cutwin_Trestmin
    = -20 0, cutwin_Trestmax = 0 60). Alternatively, avoid using CUTWIN cuts in simulation
    as they use truth values not measured values. A better long-term solution is to
    use the proposed SNCUT_NOBS_TREST feature (e.g., SNCUT_NOBS_TREST = ''1 -10 0
    : 2 0 30'') to require specific numbers of observations in defined rest-frame
    time windows.

    '
  scope: universal
  status: unverified
  source: 'GitHub Issue #1586'
