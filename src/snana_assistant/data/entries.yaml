  symptom: 'Segmentation fault in SET_ZHELIO function when fitting simulated light
    curves with

    VEL_CMBAPEX: 0 and peculiar velocities from HOSTLIB. Error message indicates computed

    zCMB differs from data file zCMB beyond tolerance (zRATIO = 0.864), followed by
    SIGSEGV.

    '
  cause: 'When fitting simulations with no CMB dipole correction (VEL_CMBAPEX: 0)
    but with

    peculiar velocities from HOSTLIB, the computed zCMB differs significantly from
    the

    data file zCMB value, exceeding the default ZTOL_HELIO2CMB tolerance. This triggers

    a fatal error abort, and ROOT fails to handle the abort cleanly, resulting in
    a

    segmentation fault.

    '
  fix: 'Increase ZTOL_HELIO2CMB tolerance in the SNLCINP configuration block. User
    reported

    success with ZTOL_HELIO2CMB = 0.1. Alternatively, skip the CMB-Helio cross-check

    entirely by setting a sufficiently large tolerance value. See SNANA manual

    section 12.2.8 for details.

    '
  scope: universal
  status: unverified
  source: 'GitHub Issue #1249'
- id: valgrind-errors-bbc-ccprior-init
  symptom: "Valgrind errors in BBC/SALT2mu crash during CCprior initialization routines.\
    \ \nUninitialized variables and divide-by-zero errors detected.\nPotential crashes\
    \ when writing to FITRES file due to uninitialized ratio values.\n"
  cause: 'Multiple issues in CCprior initialization functions:

    1. Division-by-zero in prob_CCprior_sim() when RMS=0 for spec-confirmed subset

    2. Missing early return in setup_DMUPDF_CCprior() when zero sim-CCPRIOR events

    3. Missing protection in get_muBias() for bins with nevt_biasCor=0

    4. Uninitialized CONTAM_INFO->sumProb_ratio[i] in zero_contam_CCprior()

    '
  fix: '1. Add divide-by-zero protection in prob_CCprior_sim() for RMS=0 case

    2. Return early from setup_DMUPDF_CCprior() if number of sim-CCPRIOR events equals
    zero

    3. Add protection in get_muBias() against bins with nevt_biasCor=0

    4. Initialize CONTAM_INFO->sumProb_ratio[i] = 0.0 in zero_contam_CCprior()

    '
  scope: universal
  status: unverified
  source: 'GitHub Issue #1219'
- id: take-spectrum-hardcoded-limit-exceeded
  symptom: 'FATAL ERROR during simulation: ''402 TAKE_SPECTRUM keys exceeds bound
    of 300'' error in expand_TAKE_SPECTRUM_MJD function. Roman prism survey simulations
    require more than 300 spectrum observations per supernova.'
  cause: Hard-coded limit of MXSPECTRA (MXPEREVT_TAKE_SPECTRUM) set to 300 in snlc_sim.h
    is insufficient for Roman survey observations which can require 548+ spectrum
    keys per supernova.
  fix: Increased MXSPECTRA constant from 300 to at least 548 in snlc_sim.h to accommodate
    Roman survey spectrum observation requirements.
  scope: universal
  status: unverified
  source: 'GitHub Issue #1146'
- id: header-override-file-zphot-quantiles-not-recognized
  symptom: zPDF quantiles requested for photo-z fit but there are no zPDF quantiles
    in the data error is triggered when using HEADER_OVERRIDE_FILE to provide zphot
    quantiles (HOSTGAL_ZPHOT_QXXX variables), even though NZPHOT_Q column is added
    to the override file
  cause: Data files don't contain quantiles by default, so the standard override procedure
    doesn't check for quantiles. The number of override quantiles may also differ
    from the original data, requiring special handling that wasn't implemented for
    photo-z quantile overrides.
  fix: New rd_override_zphot_q() function added to sntools_data.c that forces quantile
    override regardless of whether quantiles exist in original data. Set HEADER_OVERRIDE_FILE
    and SNCID_LIST_FILE to the same file path in &SNLCINP, or use SNCID_LIST_FILE
    = 'HEADER_OVERRIDE_FILE' to automatically sync the SNCID list with the override
    file.
  scope: universal
  status: unverified
  source: 'GitHub Issue #1140'
- id: lcfit-z-photoz-quantile-formatting-error
  symptom: 'GSL interpolation error "x values must be strictly increasing" triggered
    for every SN when using OPT_PHOTOZ=4 (LCFIT+z with p(z) host prior). ZPHOT_Q values
    read as -9 in output despite being present and strictly increasing in input HOSTLIB.

    '
  cause: 'HOSTLIB variable names for photometric redshift quantiles use incorrect
    format (e.g., ZPHOT_Q0, ZPHOT_Q10 instead of ZPHOT_Q000, ZPHOT_Q010). The snlc_fit.exe
    variable reading expects %3.3d format with exactly 3 characters after _Q, causing
    quantile values to fail reading and defaulting to -9, which then triggers GSL
    interpolation failure.

    '
  fix: 'Format HOSTLIB ZPHOT_Q variable names with %3.3d format (ZPHOT_Q000, ZPHOT_Q010,
    ZPHOT_Q020, etc. up to ZPHOT_Q100). Add validation check in snlc_fit.exe to abort
    with sensible error message if quantile variable names have fewer than 3 characters
    after _Q prefix.

    '
  scope: universal
  status: unverified
  source: 'GitHub Issue #1134'
- id: galid-corruption-fitres-merge
  symptom: SIM_HOSTLIB_GALID values in FITRES output do not match original HOSTLIB
    GALID values (e.g., 24010706944 appears in FITRES but not in source HOSTLIB)
  cause: combine_fitres.exe reads all variables as single-precision float to limit
    memory usage, causing data corruption for large GALID values that exceed float
    precision. Additionally, ICAST_for_textVar() function did not check for partial
    VARNAME matches like SIM_HOSTLIB_GALID and HOSTGAL_OBJID, so these were not being
    cast as strings to preserve precision.
  fix: Modified ICAST_for_textVar(VARNAME) function to detect partial VARNAME matches
    to 'OBJID' and 'GALID' suffixes and cast them as strings instead of floats to
    preserve full precision of large galaxy ID values.
  scope: universal
  status: unverified
  source: 'GitHub Issue #1132'
- id: salt2-missing-training-files
  symptom: SALT2 training fails with multiple ERROR messages indicating missing template
    and color correction files (salt2_template_0.dat, salt2_template_1.dat, salt2_color_correction.dat)
    in SALT2.MODEL directories. FAIL_MODE=UNKNOWN reported in TRAINOPT*.LOG files.
  cause: Training sample files were moved or compressed by the training sample maintainer,
    causing the training pipeline to not locate required SALT2 model files at the
    expected path location.
  fix: Update the path to point to the correct training sample location. For SALT2
    (JLA) files use $DES_USERS/gtaylor/SALT2_TRAINING/training_samples/RESCALED_salt2-SNLS3-SDSS3_v5
    and for SALT2 (K21-FRAG) files use /project2/rkessler/SURVEYS/DES/USERS/gtaylor/SALT2_TRAINING/training_samples/SALT2_FRAG.
    Consider moving training samples to $SNTRAIN_ROOT for better maintainability and
    public accessibility.
  scope: universal
  status: unverified
  source: 'GitHub Issue #1104'
- id: snana-version-flag-printing-discrepancy
  symptom: When running submit_batch_jobs.sh with --snana_dir flag pointing to an
    older SNANA version, the SUBMIT.INFO file reports a different SNANA_VERSION than
    expected, showing the newer version instead of the specified older version.
  cause: The SNANA_VERSION printed in SUBMIT.INFO may not accurately reflect the version
    specified via --snana_dir flag; the flag itself is processed correctly and executables
    use the correct directory, but the version reporting mechanism does not account
    for this scenario.
  fix: Verify the correct SNANA version is being used by checking the CPU*.CMD files
    which properly reference the correct SNANA_DIR, rather than relying solely on
    the SNANA_VERSION field in SUBMIT.INFO.
  scope: universal
  status: unverified
  source: 'GitHub Issue #1100'
- id: byosed-params-simgen-dump-stretch-duplicate
  symptom: SIMGEN_DUMP variable 'STRETCH' defined 2 times error when attempting to
    dump BYOSED STRETCH parameter to output files
  cause: STRETCH parameter was being defined multiple times in the SIMGEN_DUMP parsing
    logic, causing a duplicate variable definition error
  fix: Fixed bug in MATCH_INDEX_SIMGEN_DUMP to properly accept COLOR and STRETCH parameters
    from SIMGEN_DUMP without duplicate definitions
  scope: universal
  status: unverified
  source: 'GitHub Issue #979'
- id: snlc_fit-snccid-list-array-bound
  symptom: 'snlc_fit.exe aborts when using SNCCID_LIST with a large number of CIDs;
    alternatively, using SNCID_LIST_FILE causes ''EVERY SN FAILS CUTBIT 1 : CID''
    message'
  cause: Number of CIDs in SNCCID_LIST exceeds array bounds; refactor bug in SNCID_LIST_FILE
    handling causing unformatted input parsing failure
  fix: Use SNCID_LIST_FILE option with a file containing the CID list instead of inline
    SNCCID_LIST for large lists; fixed refactor bug for unformatted SNCID_LIST_FILE
  scope: universal
  status: unverified
  source: 'GitHub Issue #915'
- id: sim-SNgrid-missing-perl-module
  symptom: 'sim_SNgrid.pl fails at startup with: Can''t locate sntools.pm in @INC'
  cause: sntools.pm Perl utility module was accidentally removed during cleanup of
    obsolete scripts in January
  fix: sntools.pm module was restored to the repository
  scope: universal
  status: unverified
  source: 'GitHub Issue #902'
- id: sim-SNgrid-missing-input-files
  symptom: 'sim_SNgrid.pl fails during execution with: cp: cannot stat ''SIMGEN_INCLUDE_NONIA-S11.input''
    and missing GRID file in $SNDATA_ROOT/SIM/RKTESTSDSS_NONIA-S11/'
  cause: Required input files and pre-generated GRID files were not present; example
    configuration files referenced non-existent data directories
  fix: Bugs in sim_SNmix.pl were fixed and proper example created in $SNANA_DEBUG/SNgrid
    on Cori with correct file paths and dependencies
  scope: universal
  status: unverified
  source: 'GitHub Issue #902'
- id: segmentation-fault-snlc-sim-path-naming
  symptom: Segmentation fault in snlc_sim.exe when running with sim_SDSS.input, crash
    occurring around line 26074 in snlc_sim.c with syntax error at line 26048
  cause: Incorrect naming or configuration of the $SNDATA_ROOT path variable
  fix: Verify and correct the $SNDATA_ROOT environment variable path naming
  scope: universal
  status: unverified
  source: 'GitHub Issue #851'
- id: crazyFlux-abort-blue-salt2-color
  symptom: "FATAL ERROR ABORT called by check_crazyFlux with flux exceeding CRAZYFLUX\
    \ limit during bias correction simulations. \nError: \"flux=5.767883e+05 exceeds\
    \ CRAZYFLUX=4.705071e+05\"\nConsistently occurs at specific MJDs and LIBIDs (MJD=57339.176\
    \ LIBID=6390 and MJD=57791.063 LIBID=3948) \nin multiple DES bias correction sim\
    \ configurations.\n"
  cause: "SALT2 color parameter becomes too blue, causing the model to produce unrealistically\
    \ high flux values. \nThe GENRANGE_SALT2c color restriction (-0.3 < c) was being\
    \ overridden by the population distribution \nfile (DES5YR/populations/G10-GENPDF-RATE.DAT)\
    \ which had a wider color range (-0.5 < c), \nallowing overly blue colors to be\
    \ generated.\n"
  fix: "Restrict the SALT2 color range in the population distribution file to match\
    \ or be tighter than \nthe GENRANGE_SALT2c parameter. Ensure color range does\
    \ not exceed -0.3 < c in G10-GENPDF-RATE.DAT \nor other population files to prevent\
    \ extremely blue SALT2 colors that cause flux computation failures.\n"
  scope: universal
  status: unverified
  source: 'GitHub Issue #766'
- id: corrupted-root-file-long-filename-merge
  symptom: 'Fatal error during ROOT file merge: ''Cannot get NEVT from merged ROOT
    table after 2 attempts'' with message indicating table may be corrupted. Merge
    command fails even though individual jobs complete successfully.'
  cause: 'Buffer overflow in sntable_dump.c: filename buffer allocated only 200 characters
    but actual filename was 201 characters long, causing memory corruption of the
    merged ROOT file.'
  fix: Increase MXPATHLEN constant from 200 to 300 to accommodate longer filenames.
    Validated using --merge_reset / -M options.
  scope: universal
  status: verified
  source: 'GitHub Issue #534'
- id: salt2mu-subprocess-quoted-varnames-parsing-error
  symptom: SALT2mu SUBPROCESS reads extra quotation mark from SUBPROCESS_OUTPUT_TABLE
    argument, resulting in malformed VARNAME parsing (e.g., 'x1 instead of x1) in
    debug log line 522
  cause: Quotes around the SUBPROCESS_OUTPUT_TABLE argument value are being included
    in the parsed variable name instead of being treated as optional delimiters
  fix: Remove quotes from the SUBPROCESS_OUTPUT_TABLE argument; quotes are optional
    and should not be included in the command string
  scope: universal
  status: unverified
  source: 'GitHub Issue #495'
- id: batch-jobs-missing-version-directory
  symptom: submit_batch_jobs.sh appears to delete or overwrite input directory contents.
    User reports directory /project2/rkessler/SURVEYS/WFIRST/USERS/brose3/boone/5D-BC/
    generated from input file is missing information. Error occurs when MERGE.LOG
    references a version directory (e.g., KYLE_DATA or PIP_BP-HALO-CMB_LOWZ_DATA)
    that does not exist.
  cause: The MERGE.LOG and SUBMIT.INFO files were manually created to mimic required
    SNANA fit output rather than being generated from an actual SNANA fit. When submit_batch_jobs.sh
    processes the input, it encounters references to version directories that don't
    exist, leading to missing or corrupted output directory contents.
  fix: Ensure MERGE.LOG and SUBMIT.INFO files are either generated from a valid SNANA
    fit or contain only references to version directories that actually exist on disk.
    The tool now provides a more sensible abort message when a referenced version
    directory is missing.
  scope: universal
  status: unverified
  source: 'GitHub Issue #461'
- id: psfsig-outside-valid-range-abort
  symptom: 'FATAL ERROR ABORT in interp_GALMAG_HOSTLIB when PSFSIG exceeds valid range
    (0.01 - 2.13 asec). Error message: ''g-PSFSIG=2.424000 asec outside valid range
    ( 0.01 -  2.13) Cannot extrapolate GALMAG. SIMLIB_ID=19721'''
  cause: LSST SIMLIB had an epoch where PSF (FWHM) was ~5 arcsec, exceeding the boundary
    of the PSF-binned map used in interp_GALMAG function. The function could not extrapolate
    beyond the map edges.
  fix: Modified interp_GALMAG to use the PSF value at the map edge instead of aborting
    when PSF is outside the valid map range.
  scope: universal
  status: unverified
  source: 'GitHub Issue #427'
- id: salt2mu-unknown-error-insufficient-memory
  symptom: salt2mu job fails with FAIL_MODE UNKNOWN, but FAIL_REPEAT_SCRIPT runs successfully
    when executed manually. Job appears to complete sometimes on resubmission but
    fails consistently when resubmitted via submit_batch.
  cause: Insufficient memory allocation - 2GB default memory limit is not enough for
    the salt2mu job to complete successfully in batch submission context.
  fix: Add BATCH_MEM configuration parameter with increased memory value (4000 MB
    recommended) under the CONFIG block in the input file.
  scope: universal
  status: unverified
  source: 'GitHub Issue #378'
- id: cidran-exceeds-sim-limit
  symptom: 'Simulation crashes with FATAL ERROR: CIDRAN_MAX exceeds MXCID_SIM limit
    of 299999999. Error occurs in init_CIDRAN during large simulation generation with
    high NGEN_UNIT and RANSEED_REPEAT multipliers.'
  cause: "Large simulation samples with high multipliers (e.g., NGEN_UNIT=42 \xD7\
    \ RANSEED_REPEAT=30 = 1260x) generate CID counts exceeding the hardcoded limit\
    \ of 300 million per submit."
  fix: Rebalance cosmology component types to reduce total generated events below
    300 million limit, or increase MXCID_SIM parameter in source code if necessary.
  scope: universal
  status: unverified
  source: 'GitHub Issue #360'
- id: mxsnlc-fitting-limit-exceeded
  symptom: 'Light curve fitting crashes with FATAL ERROR: NROW=4249374 exceeds bound
    MXSNLC=4000000 in RDVERSION_FITS. Fitting stage cannot process large simulations
    that pass generation stage.'
  cause: Fitting stage has separate memory/array bound (MXSNLC=4000000) that is lower
    than simulation generation limits, causing fitting to fail on valid large simulations.
  fix: Increased MXSNLC parameter from 4 million to 5 million in snana.car configuration.
  scope: universal
  status: unverified
  source: 'GitHub Issue #360'
- id: salt2mu-override-redshift-recalc
  symptom: When using redshift overrides (zHD or VPEC) in SALT2mu, the mumodel is
    not recalculated correctly. zCMB gets set to input zHD value, and MUMODEL does
    not equal LCDM(zHD) as expected.
  cause: SALT2mu does not recalculate the distance modulus (mumodel) when redshift
    override parameters are provided, leaving it with stale values from the original
    data.
  fix: Fixed to work with zHEL and VPEC/VPECERR columns. Specifying zHD and VPEC together
    now triggers an ABORT to prevent ambiguous results. Users should provide zHEL
    with VPEC overrides instead.
  scope: universal
  status: unverified
  source: 'GitHub Issue #314'
- id: host-ddlr-numerical-roundoff-costheta
  symptom: 'FATAL ERROR ABORT called by GEN_SNHOST_DDLR with "Invalid cosTH = -1.000000"
    for GALID entries. Also reports cases where LEN_SN and DOT parameters produce
    out-of-range values. Affects PS1_7D simulations in SNANA batch jobs, with most
    cores finishing quickly while 4 cores remain glacially slow.

    '
  cause: 'Numerical round-off errors in GEN_SNHOST_DDLR causing cosTHETA to be calculated
    just outside the valid range of [-1, 1], triggering fatal validation checks. Also
    relates to truncated error messages that initially obscured the true cause.

    '
  fix: 'Fixed numerical round-off issue causing cosTHETA to fall outside [-1, 1] bounds.
    Corrected error message truncation to provide complete diagnostic information.

    '
  scope: universal
  status: unverified
  source: 'GitHub Issue #275'
- id: misspecified-cutwin-parameter-segfault
  symptom: 'Segfault error when CUTWIN parameters are misspecified (e.g., CUTWIN_COLUMNNAME:
    0.9 instead of CUTWIN_COLUMNNAME: 0.9 1.0). Error is hard to track due to lack
    of validation.'
  cause: BBC code does not validate CUTWIN parameter format before use, allowing incomplete
    specifications to cause memory access violations.
  fix: Added parsing checks on CUTWIN parameters to validate proper format before
    processing.
  scope: universal
  status: unverified
  source: 'GitHub Issue #244'
- id: relative-paths-submission-script
  symptom: Relative paths in simulation inputs fail to work with the new submission
    script. When jobs are submitted, relative file paths like `$SNANA_DEBUG/mdai/new_submission`
    do not resolve correctly, and submission fails even though the command works when
    run manually from the job folder.
  cause: The submit_batch script did not properly handle relative paths (paths containing
    a slash but not starting with a slash). Additionally, the script did not account
    for certain configuration files like KCOR_FILE that also require proper path resolution.
  fix: Submit_batch was fixed to automatically prepend CWD/ to files with partial
    paths (containing a slash but not starting with /). For files like KCOR_FILE,
    use absolute paths. Alternatively, place all files in the same directory and exclude
    paths from filenames. Absolute paths are recommended over relative paths for easier
    debugging.
  scope: universal
  status: unverified
  source: 'GitHub Issue #238'
- id: fitres-tree-missing-zero-spectra-bug
  symptom: 'FATAL ERROR ABORT from sntable_dump.exe: Tree = ''FITRES'' does not exist
    when running split_and_fit.pl on WFIRST simulations. This appears as a crash in
    sntable_dump.pl line 131 during FITOPT fitting stage.

    '
  cause: 'Bug in snlc_fit where events with zero spectra (NSPEC=0) caused code to
    attempt reading spectra with invalid ROW index of -9, resulting in failed snlc_fit
    jobs and missing FITRES output table.

    '
  fix: 'Bug fix propagated to Midway. The root cause must be fixed in snlc_fit to
    properly handle events with NSPEC=0 without attempting invalid array access.

    '
  scope: universal
  status: unverified
  source: 'GitHub Issue #191'
- id: short-username-temp-file-padding
  symptom: sim_SNmix.pl fails during file operations when username is shorter than
    4 characters. Username appears with newline character in log files (e.g., 'kxw'
    followed by newline instead of proper filename). File operations abort due to
    malformed filenames with blank spaces.
  cause: Temp file naming scheme assumes usernames are at least 4 characters long
    and extracts the first 4 characters. Usernames with fewer than 4 characters result
    in filenames with trailing spaces/newline characters, causing file operation failures.
  fix: Modified sim_SNmix.pl to pad usernames with zeros to ensure 4-character minimum
    length. Username 'kxw' is now converted to 'kxw0' for temp file naming.
  scope: universal
  status: unverified
  source: 'GitHub Issue #180'
- id: specz-efficiency-peakmjd-varnames-limit
  symptom: 'FATAL ERROR in read_VARNAMES_KEYS: NVAR=15 exceeds MXVAR=10 when attempting
    to use PEAKMJD_RANGE in SEARCHEFF_zHOST efficiency file with multiple VARNAMES
    (e.g., Fields and Years). Additionally, interp_SEARCHEFF_zHOST fails with "Invalid
    NMATCH=10" error when processing light curves with PEAKMJD values.

    '
  cause: 'The SEARCHEFF_zHOST implementation had insufficient hardcoded limits (MXVAR=10)
    for the number of variables that could be included in efficiency maps. When adding
    PEAKMJD_RANGE feature alongside existing HOSTLIB properties (Fields, Years), the
    variable count exceeded the maximum allowed. Additionally, the interpolation logic
    did not properly handle PEAKMJD matching constraints.

    '
  fix: 'Extended the maximum number of allowed maps and fixed variable name parsing
    logic to properly handle PEAKMJD_RANGE in addition to HOSTLIB properties. The
    fix allows VARNAMES to include both galaxy properties and PEAKMJD without exceeding
    internal limits.

    '
  scope: universal
  status: unverified
  source: 'GitHub Issue #177'
- id: missing-genpdf-file-segfault
  symptom: Segmentation fault causing SLURM error code 2 and immediate job crashes
    without abort trap message
  cause: GENPDF_FILE did not exist, and missing abort trap in SALT2mu.c allowed process
    to crash instead of exiting gracefully
  fix: Added abort trap in SALT2mu.c to handle missing GENPDF_FILE condition
  scope: universal
  status: unverified
  source: 'GitHub Issue #172'
