  cause: 'The FLUXERRMODEL_FILE scaling logic assumes scale factors > 1.0. When scale
    < 1.0, the error calculation (likely involving variance or squared errors) produces
    a negative value before taking a square root, causing an abort.

    '
  fix: 'Workaround: Adjust physical parameters (GAIN, SKYSIG, or PSF) instead of using
    FLUXERRMODEL_FILE for scaling factors < 1.0. The error fudge map feature is intended
    primarily for local surface brightness anomalies with scale factors >= 1.0. For
    scaling down errors, modify the underlying instrumental parameters (PSF, SKY,
    GAIN) to achieve the desired error scaling.

    '
