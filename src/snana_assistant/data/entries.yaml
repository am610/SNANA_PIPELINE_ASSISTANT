- id: numerical-bias-muerr-below-1e-3
  symptom: 'When MUERR (stat-only) falls below 10^-3, a bias appears in cosmology
    fits (w parameter).

    Additionally, wfit fails with "Cannot open mucov_file" when attempting to read
    MUCOVTOT^{-1} because

    the string ''None'' from INFO.YAML is treated as truthy instead of falsey None.

    '
  cause: 'Multiple issues: (1) Numerical precision problem when MUERR values are extremely
    small (< 1e-3),

    causing bias in fitted cosmological parameters. (2) wfit reads covtot_inv_file
    as the string ''None''

    rather than Python''s falsey None, causing conditional checks to incorrectly attempt
    file operations

    on a non-existent file path.

    '
  fix: 'Short-term: Use -snrms option in wfit to artificially inflate MUERR floor.
    In pippin,

    add "EXTRA_OPTS: --write_mask_cov 1" under 7_CREATE_COV block to write COVSYS
    matrix

    instead of fully-inverted MUCOVTOT_INV. Fixed wfit to replace string ''None''
    with falsey None

    when reading covtot_inv_file from INFO.YAML. Long-term: Root cause of numerical
    bias with

    ultra-tiny MUERR remains unresolved.

    '
  scope: universal
  status: unverified
