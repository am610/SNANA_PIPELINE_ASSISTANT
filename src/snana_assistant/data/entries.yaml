- id: stale-busy-merge-lock
  symptom: 'LOG shows "Wait for [''BUSY_MERGE_CPUXXXX.LOCK''] to clear" repeated for
    hours, then "CANCELLED ... DUE TO TIME LIMIT". Zero fitting occurs despite the
    job running its full walltime.

    '
  cause: 'A prior merge crash or kill left a BUSY_MERGE_CPU*.LOCK file in output/.
    The resubmitted job''s CMD calls --merge after each fit and waits indefinitely
    for the stale lock.

    '
  fix: 'Before resubmitting any RERUN batch: rm -f output/BUSY_MERGE_CPU*.LOCK'
  scope: universal
  status: verified
  source: EUCLID_LSST_DDF_V4_PHOTOZ FIT_DATA_EUCLID_PHZ, 2026-06-09
- id: missing-fitres-after-merge-abort
  symptom: '"FATAL ERROR ABORT: Missing expected PIP_...-00XX/FITOPTYYY.FITRES" in
    the merge log.

    '
  cause: 'A merge attempt aborted mid-way (stale lock, truncated FITRES, allocation
    kill). The merge driver marked the version/FITOPT DONE in MERGE.LOG but never
    wrote the final merged FITRES file.

    '
  fix: "1) Verify raw FITRES.TEXT is intact: grep -c '^SN:' <VERSION>_FITOPTYYY_SPLIT001.FITRES.TEXT\
    \ 2) If intact, rebuild: cat <PREFIX>_FITOPTYYY*FITRES.TEXT > /tmp/MERGE_tmp.FITRES;\n\
    \   awk '!/^VARNAMES/ || ++n <= 1' /tmp/MERGE_tmp.FITRES > /tmp/MERGE2_tmp.FITRES;\n\
    \   cp /tmp/MERGE2_tmp.FITRES ../PIP_...-00XX/FITOPTYYY.FITRES\n3) Truncate the\
    \ FATAL ERROR from MERGE.LOG, delete ALL.DONE, run MERGE_LAST.\n"
  scope: universal
  status: verified
  source: -0018/FITOPT018.FITRES, 2026-06-09
- id: sigint-abort-bbc
  symptom: BBC (SALT2mu) aborts citing sigint.
  cause: Attempting to use a nonexistent 'sigint_fix' option.
  fix: "Use sigmb_biascor, not sigint_fix \u2014 the latter does not exist."
  scope: universal
  status: verified
  source: pipeline-debug checklist / project ground rules
- id: missing-salt2-pdf
  symptom: LCFIT/sim aborts referencing missing SALT2 probability-density files.
  cause: SALT2_INFO path in the sim input file is wrong or the PDF files aren't at
    that path.
  fix: Verify SALT2_INFO path in the sim input file against what's actually on disk.
  scope: universal
  status: verified
  source: pipeline-debug checklist / project ground rules
- id: hostlib-dztol-too-tight
  symptom: HOSTLIB-related aborts or excessive event rejection during host matching.
  cause: HOSTLIB_DZTOL tolerance set too tight for the redshift precision in the HOSTLIB.
  fix: Loosen HOSTLIB_DZTOL in the HOSTLIB config.
  scope: universal
  status: verified
  source: pipeline-debug checklist / project ground rules
- id: genversion-truncation
  symptom: Sim runs under a different effective GENVERSION than specified, or two
    long-named runs collide.
  cause: GENVERSION strings are silently truncated at ~72 characters.
  fix: Keep GENVERSION names short; check for truncation collisions with long descriptive
    names.
  scope: universal
  status: verified
  source: Bailey+2022 reproduction session, 2026-08-16
- id: slurm-jobname-truncation-collision
  symptom: Pippin reruns appear to silently reuse/interfere with a prior job.
  cause: 'Slurm job names are truncated at ~8 characters; two differently-named Pippin
    jobs can collide after truncation.

    '
  fix: Check squeue -u $USER for duplicate truncated names before assuming a config/code-level
    failure.
  scope: slurm
  status: verified
  source: pipeline-debug checklist, step 1
- id: stale-cached-yaml
  symptom: A config fix is made but the pipeline still fails the same way.
  cause: 'Pippin copies YAMLs into its output staging directory at runtime; a source-YAML
    fix isn''t picked up if a prior copy was already cached for that stage.

    '
  fix: "diff <source_yaml> <pippin_output_dir>/<stage>/<cached_yaml> \u2014 if they\
    \ differ, fix the cached copy directly or force a rerun of that stage.\n"
  scope: universal
  status: verified
  source: "pipeline-debug checklist, step 2 \u2014 most common false 'the fix didn't\
    \ work' report"
- id: hostlib-nbrlist-crazy-sep
  symptom: 'Simulation fails/aborts mid-run with "FATAL ERROR ABORT called by GEN_SNHOST_DDLR"
    and "Crazy SN-galaxy sep = X arcsec for i_nbr=0 ... Likely a problem with NBR_LIST"
    in the log.

    '
  cause: 'Manually deleting or editing rows in a HOSTLIB file that contains pre-computed
    NBR_LIST columns. The row offsets in NBR_LIST point to the wrong rows after deletions,
    leading to corrupted galaxy matching.

    '
  fix: 'Do not manually edit a HOSTLIB with NBR_LIST. Edit the original host catalog
    (without NBR_LIST), remove the bad rows, and then run `snlc_sim.exe NOFILE HOSTLIB_FILE
    <hostlib> +HOSTNBR` to regenerate the NBR_LIST columns.

    '
  scope: universal
  status: verified
  source: 'GitHub Issue #1637'
- id: dump-alignment-mismatch
  symptom: 'Simulation dump files contain misaligned columns (e.g., some rows end
    with 3 integers while others end with 2 integers), leading to NaNs or corrupt
    values in columns like FLAG_ACCEPT.

    '
  cause: 'Mixing SIMGEN_DUMPALL (typically used for Ia) and SIMGEN_DUMP (typically
    used for non-Ia) across different simulation input files within the same Pippin
    job. This outputs a different number of variables, causing Pippin''s dump merge
    step to misalign columns.

    '
  fix: 'Ensure all simulation input files within the same Pippin job use the same
    dump configuration (either SIMGEN_DUMPALL or SIMGEN_DUMP) and output identical
    variables.

    '
  scope: universal
  status: verified
  source: 'GitHub Issue #1618'
- id: negative-redshift-lcfit-photoz
  symptom: SNe passing LCFIT with fitted redshift z=0 (or negative zCMB) when using
    photo-z priors, causing downstream errors in BBC. Occurs only with LCFIT+z when
    photo-z estimates are far from true spectroscopic redshift.
  cause: Photo-z priors that are pathologically far from true redshift (e.g., photo-z~0.2
    when zSpec~0.8) result in degenerate fits where stretched parameters absorb the
    redshift difference, allowing unphysical fitted z=0 solutions. Default PRIOR_ZERRSCALE=1000
    effectively flattens the photo-z prior, and incorrect header variable names (HOSTGAL_ZPHOT
    vs HOSTGAL_PHOTOZ) prevent proper prior application.
  fix: '1) Use correct header override variable names: HOSTGAL_PHOTOZ and HOSTGAL_PHOTOZ_ERR
    instead of HOSTGAL_ZPHOT/HOSTGAL_ZPHOTERR. 2) Set PRIOR_ZERRSCALE=1.0 (not default
    1000) when using photo-z mean/STD as prior. 3) Apply combination cuts on FITPROB,
    color, and stretch parameters to reject pathological fits. 4) Consider CUTWIN_REDSHIFT
    and FITWIN_PROB cuts, though these alone are insufficient for pathological cases.'
  scope: universal
  status: unverified
  source: 'GitHub Issue #1157'
- id: snn-classifier-filter-naming-mismatch
  symptom: 'SuperNNovaClassifier fails during Pippin analysis with ValueError during
    HDF5 loading: "shape mismatch: value array of shape (26,9) could not be broadcast
    to indexing result of shape (1,26)". Occurs when applying models trained with
    single-character filter names (g, r, i, z) to data with full filter strings (DES-g,
    DES-r, DES-i, DES-z), or vice versa.

    '
  cause: 'Recent simulation update changed filter string format from single-character
    representation (e.g., ''g'') to full filter strings (e.g., ''DES-g''). SNN models
    trained with one format fail when applied to data with the other format due to
    filter name mismatch causing shape incompatibility in feature arrays during HDF5
    data loading.

    '
  fix: '1) Ensure consistent filter naming between training and test data. In Pippin
    analysis.yml, explicitly specify LIST_FILTERS matching the data format (e.g.,
    `--list_filters g i r z` for single-char or `--list_filters DES-g DES-r DES-i
    DES-z` for full strings).

    2) For DES 5-year backward compatibility, use SuperNNova branch SNANA_DES5yr which
    includes a patch allowing models trained with single-char filters to be applied
    to DES-prefixed filter data.

    '
  scope: universal
  status: unverified
  source: 'GitHub Issue #1449'
- id: segfault-lightcurve-generation-uninitialized-mwxt-table
  symptom: 'Segmentation fault during light curve generation in INTEG_zSED_SALT2,
    occurring after ''Begin Generating Lightcurves'' message. Crash happens during
    genSpec_SALT2 call when processing redshift z~1.3. Stack trace shows: INTEG_zSED_SALT2
    -> genSpec_SALT2 -> GENSPEC_TRUE -> GENSPEC_DRIVER -> main'
  cause: fill_TABLE_MWXT_SEDMODEL() is called from genmag_SALT2 only when event has
    bands within SALT2 model range. For events with no bands in range (e.g., high-z
    events), the MWXT table is never allocated or filled. Subsequently, genSpec_SALT2
    is called and attempts to use the uninitialized MWXT table, causing a segmentation
    fault.
  fix: Call fill_TABLE_MWXT_SEDMODEL() from genSpec_SALT2 with a guard to do nothing
    if already called from genmag_SALT2. This ensures the MWXT table is always allocated
    and filled before genSpec_SALT2 uses it.
  scope: universal
  status: unverified
  source: 'GitHub Issue #1248'
- id: stack-smashing-sample-input-files
  symptom: 'Stack smashing detected during lightcurve generation with sample input
    files (sim_SDSS.input, sim_HST.input, sim_LOWZ.input).

    Error message: "*** stack smashing detected ***: <unknown> terminated" followed
    by "Abort (core dumped)".

    Occurs after "Begin Generating Lightcurves" and "Found Max dN/dz * wgt" calculation.

    '
  cause: 'System-specific library or environment issue rather than code defect. Valgrind
    analysis on maintainer''s system showed zero errors.

    The stack smashing was not reproducible on alternative Linux systems, suggesting
    the issue is related to specific library versions or system configuration on the
    affected machine.

    '
  fix: '1. Update to latest version of SNANA code and SNDATA_ROOT files from snana.uchicago.edu.

    2. Verify sufficient memory is available (2GB minimum recommended).

    3. If problem persists, try running on a different Linux system with updated libraries.

    4. For cosmological parameters, use code defaults (Planck 2018 values: OM=0.315)
    rather than explicit parameter specification in input files.

    '
  scope: universal
  status: unverified
  source: 'GitHub Issue #57'
- id: sim-alpha-beta-delta-function-numerical-artifact
  symptom: 'FATAL ERROR ABORT in get_BININFO_biasCor_abg when running bias corrections.

    Error message: "SIM_alpha values exceeds bound of 2" or "SIM_beta values exceeds
    bound of 2".

    Occurs when GENPDF file specifies delta-function distributions (zero sigma) for
    SALT2ALPHA and SALT2BETA.

    Simulations with GENSIGMA set to 0 still produce multiple discrete values (e.g.,
    2.64599, 2.646, 2.64601) instead of true delta functions.

    '
  cause: 'Numerical artifacts in sntools_genPDF.c and sntools_gridmap.c caused delta-function
    parameters to be internally broadened,

    resulting in multiple discrete values instead of a single value. The code did
    not properly handle zero-width distributions.

    '
  fix: 'Rick Kessler found and fixed numerical artifacts in sntools_genPDF.c and sntools_gridmap.c.

    Verified that SALT2BETA delta function in GENPDF_FILE now correctly delivers a
    delta function in output data.

    Users should update to the fixed code version.

    '
  scope: universal
  status: unverified
  source: 'GitHub Issue #1533'
- id: redshift-significant-figures-truncation
  symptom: Heliocentric redshift values from header override files are truncated to
    3 decimal places in output FITRES files, despite input precision up to 8 decimal
    places (e.g., zHEL=0.0304675 becomes zHEL=0.030)
  cause: Z-variables from override table were being written with incorrect format
    specification
  fix: Changed all z-variables from override table to be written with %.5f format
  scope: universal
  status: unverified
  source: 'GitHub Issue #368'
- id: duplicate-sne-inconsistent-merging
  symptom: Repeat SNe with iflag_duplicate=2 are not consistently merged across output
    files; same SNe appear with different repetition counts in different FITOPT/MUOPT
    combinations (e.g., 2008Q repeated 1 time in FITOPT000_MUOPT003 but 2 times in
    FITOPT000_MUOPT004)
  cause: 'Multiple issues: (1) hard limit of 20 duplicate sets was insufficient (job
    had ~100); (2) abort trap on limit exceeded had a bug; (3) duplicate matching
    logic based on redshift and VPEC sorting could confuse different events in same
    galaxy with very similar parameters; (4) adjacent duplicates were being skipped
    in the matching algorithm'
  fix: Increased duplicate limit from 20 to 200; fixed abort trap bug; re-worked duplicate
    logic to allow for different events in same galaxy; fixed bug that skipped adjacent
    duplicates in matching
  scope: universal
  status: unverified
  source: 'GitHub Issue #368'
- id: missing-photoz-quantiles-abort
  symptom: 'snlc_fit.exe aborts with "zPDF quantiles requested for photo-z fit to
    CID=250945 but there are no zPDF quantiles in the data" when fitting events that
    have photo-z estimates in nominal sample definition but lack them in photoz override
    file (e.g., BPZ instead of KNN).

    '
  cause: 'When nominal sample definition depends on "good" pz estimates from one source
    (e.g., KNN), fitopts using alternative photoz estimates (e.g., BPZ) may lack quantile
    data for events in the nominal sample. Events missing in the override file would
    cause the code to abort instead of gracefully skipping them.

    '
  fix: 'Implemented ABORT_ON_MISSING_QZPHOT flag in &SNLCINP namelist (default=T).
    Set to F to skip events with missing quantiles instead of aborting. Additionally,
    implemented NULL_ON_MISSING_EVENT feature in HEADER_OVERRIDE_FILE to force use
    of only values present in override file, setting missing entries to -9 rather
    than preserving stale values. Fixed bug where quantile overrides with IMPLICIT
    method (QZPHOT00...QZPHOTnn) only loaded igal=0 and clobbered igal>0 values. Fixed
    quantile override logic to set HOSTGAL_PHOTOZ[_ERR] to -9 when all quantiles are
    -9.

    '
  scope: universal
  status: unverified
  source: 'GitHub Issue #1661'
- id: pippin-jobs-stuck-after-simnorm
  symptom: Pippin jobs halt after SIMnorm stage and do not progress to subsequent
    stages. Jobs either become stuck in 'CG' (completing) state on the queue or fail
    to create SUBMIT.INFO and CPU*.CMD files. The generated CMD runs successfully
    when executed interactively.
  cause: 'Multiple potential causes identified: (1) Midway cluster node I/O issues
    causing jobs to enter stuck ''CG'' state where they cannot be terminated, (2)
    Storage quota issues preventing job progression, (3) Underlying SLURM scheduler
    issues on Midway2 infrastructure.'
  fix: 'Workaround: Cancel all suspended CG state jobs using ''scancel --me'' and
    re-launch the pippin job. Note that jobs in CG state cannot be directly cancelled.
    The Midway2 RCC team reported fixing an underlying issue causing CF/CG state problems
    as of the issue resolution date. If quota-related, ensure sufficient disk space
    allocation.'
  scope: slurm
  status: unverified
  source: 'GitHub Issue #1236'
- id: fieldgroup-biascor-case-parsing-and-overlap-bug
  symptom: '1. "Invalid command-line override: fieldGroup_biascor=..." fatal error
    when using fieldGroup_biascor parameter with mixed-case naming

    2. "IDSAMPLE=1(DES(...)) copied 2 times. but should be copied once" fatal error
    in sort_IDSAMPLE_biasCor when combining fieldGroup_biascor with surveygroup_biascor
    that both reference DES

    3. BBC crashes when fieldlist includes VOID entries for samples without field
    information

    '
  cause: '1. Case-sensitivity bug: internal variable parsed fieldgroup_biascor (lowercase)
    but user input fieldGroup_biascor (mixed case) was rejected

    2. DES double-counting: fieldGroup_biascor and surveygroup_biascor both could
    match DES samples, causing duplicate entries in IDSAMPLE sorting

    3. Memory insufficiency: 2GB default memory inadequate for combined multi-survey
    datasets (DES + Lowz + Foundation)

    '
  fix: '1. Fixed case-parsing to accept both fieldGroup_biascor and fieldgroup_biascor
    (case-insensitive)

    2. Modified SALT2mu to allow DES appearing in both fieldGroup_biascor and surveygroup_biascor
    without double-counting

    3. Increase batch memory allocation beyond 2GB default (doubled memory resolved
    crashes)

    4. For FIELD column with overlaps (e.g., X1+X3), fieldGroup assignment uses partial
    matching and may depend on order; verify IDSAMPLE in BBC output to check assignments

    '
  scope: universal
  status: unverified
  source: 'GitHub Issue #764'
- id: bbc-rewgt-sigint-biascor-weight-not-applied
  symptom: BBC REWGT method produces larger w-bias (0.0110 +- 0.0022) compared to
    NOM (0.0035 +- 0.0024). sigint(biasCor) values are notably larger for REWGT. When
    comparing BBC_SUMMARY_FITPAR.YAML between NOMINAL and REWGT runs, sigint values
    differ significantly.
  cause: WGT_POPULATION was not being applied when computing sigint_biasCor in the
    SALT2mu function init_sigInt_biasCor_SNRCUT(). This caused incorrect intrinsic
    scatter estimation for the REWGT biasCor method.
  fix: 'Modified init_sigInt_biasCor_SNRCUT() in SALT2mu function to apply WGT_POPULATION
    when computing sigint_biasCor. After fix, fitted sigint values became much closer
    between NOMINAL and REWGT. However, w-bias issue persisted even after fix and
    investigation with opt_biascor=752. Current recommendation: do not use REWGT option.'
  scope: universal
  status: unverified
  source: 'GitHub Issue #1353'
- id: simlib-wavelength-range-exceeded
  symptom: 'FATAL ERROR ABORT called by COMPUTE_SIMLIB_INFO when creating SIMLIB from
    light curve files with observations outside hard-wired wavelength limits.

    Error message: "LAMOBS exceeds max LAM" or "Cannot determine SKYSIG after NLOOP
    tries"

    Occurs when processing NIR observations (K-band, L-band, M-band) or observations
    with unusually small magnitude errors.

    '
  cause: 'Hard-wired upper wavelength limits in SKYLAM_SPACE_LIST and SKYMAG_SPACE_LIST
    arrays in snana.car were insufficient for infrared observations (JWST L/M bands,
    ground-based K-band).

    Additionally, the SKYSIG calculation loop fails to converge when magnitude errors
    are very small (e.g., 0.01 mag), causing inability to determine sky signal after
    maximum iterations.

    '
  fix: '1. Extended SKYLAM_SPACE_LIST and SKYMAG_SPACE_LIST arrays in snana.car to
    accommodate wavelengths up to 30,000 Angstroms for ground-based observations.

    2. For K-band observations with very small magnitude errors, increase the reported
    magnitude errors to realistic values that allow the SKYSIG solver to converge.

    '
  scope: universal
  status: unverified
  source: 'GitHub Issue #1349'
- id: elasticc2-hostgal-field-undefined-values
  symptom: 'ELAsTiCC round 2 stream contains unexpected values in host galaxy fields:

    1. hostgal_ellipticity and hostgal_sqradius have inconsistent null values (-9999
    vs -999)

    2. hostgal_zphot_q000 has bizarre negative values (e.g., -12.56) instead of expected
    -9

    3. hostgal_magerr_<filter> contains negative values for very faint objects

    '
  cause: 'Multiple causes identified:

    1. Inconsistent null value handling: -9999 means variable never defined; -999
    is artifact from UNMATCHED_COSMODC2_GHOST.HOSTLIB in CosmoDC2 for AGN without
    matched sqradius/ellipticity

    2. Photo-z quantile scaling bug: when ZPHOT_Q000=-9 (null) for catastrophic photo-z
    estimates, the null value gets scaled by (zSN/zGAL) ratio instead of preserving
    the null marker, producing scaled bizarre values like -12.56

    3. Negative magnitude errors from CosmoDC2 for very faint objects (~mag 30) with
    no significant flux

    '
  fix: '1. Fixed GEN_SNHOST_ZPHOT_QUANTILE (sntools_host.c) to preserve -9 null value
    instead of scaling it

    2. Modified SNANA to set magerr=9.0 for any negative magerr or magerr<9 to handle
    faint objects with invalid flux

    3. Documented that -999 values are artifacts from DC2; upstream PZ fix needed
    before commissioning

    '
  scope: universal
  status: unverified
  source: 'GitHub Issue #1210'
- id: simulated-spectrum-wavelength-truncation
  symptom: "Simulated spectra have shorter wavelength range than specified in SIMLIB.\
    \ Spectra were truncated to ~9000-9400 \xC5 despite SIMLIB indicating wavelength\
    \ ranges extending beyond 10000 \xC5, and kcor logs showing final storage range\
    \ up to 12564 \xC5."
  cause: "Primary spectrum wavelength storage was constrained to the wavelength range\
    \ of filters (I-band has max wavelength around 9215 \xC5). The kcor program had\
    \ multiple wavelength cuts that were not accounting for spectrograph wavelength\
    \ ranges that extended beyond the filter ranges."
  fix: "Modified kcor program to extend stored wavelength range when spectrograph\
    \ extends beyond filter wavelength ranges. Fixed additional wavelength cuts in\
    \ kcor that were causing truncation. Simulated spectra now extend to approximately\
    \ 10,500 \xC5, limited by the spectral range of the actual spectroscopic data\
    \ rather than filter ranges."
  scope: universal
  status: unverified
  source: 'GitHub Issue #695'
- id: fits-header-missing-end-card
  symptom: 'OSError: Header missing END card when converting DAT to FITS format. FITS_HEAD
    files are entirely empty or unreadable. SNN reports FITS header is missing an
    END card.'
  cause: TEXT formatted data files contain numerous NaN values in the FLUX column
    that cause RD_SNTEXTIO_EVENT to abort during TEXT to FITS conversion, resulting
    in empty or malformed FITS output files lacking proper header structure including
    the required END card.
  fix: Fix the source TEXT formatted data files to remove or handle NaN values in
    the FLUX column before conversion. SNANA added validation to detect and report
    NaN errors during TEXT file reading with fatal abort messages.
  scope: universal
  status: unverified
  source: 'GitHub Issue #441'
- id: mac-random-data-struct-incomplete-type
  symptom: 'Compilation error on macOS: ''array has incomplete element type random_data''
    when compiling snlc_sim.c. The compiler cannot instantiate an array of struct
    random_data because the struct definition is incomplete (only forward declared).'
  cause: The struct random_data is only forward declared in sntools.h but never fully
    defined. On macOS, the struct definition from system headers is not available
    or compatible, causing array declaration failures. Additionally, macOS lacks the
    *_r random functions (initstate_r, srandom_r, random_r) that were being used for
    multiple random streams.
  fix: "Add a minimal struct random_data definition before line 169 in sntools.h:\n\
    ```\nstruct random_data {\n  int someInteger;\n};\n```\nAlternatively, use the\
    \ ONE_RANDOM_STREAM preprocessor flag in sntools.h to disable multi-stream random\
    \ number generation on macOS (see manual page 15)."
  scope: universal
  status: unverified
  source: 'GitHub Issue #158'
- id: spectrograph-snr-computation-pathological-solutions
  symptom: snlc_sim.exe produces incorrect SNR values for spectra (e.g., 0.579 instead
    of requested 7.0), and kcor.exe fails with 'Could not find getSNR_spectrograph(ZP_S)
    bin for VAL=-nan' error when spectrograph table has insufficient MAGREF range
    or bad ZP/SKYSIG solutions.
  cause: Spectrograph table with bad SNR values (SNR independent of magnitude or exposure
    time), and pathological ZP/SKYSIG solutions outside MAGREF range that produce
    negative variance and NaN values, particularly in UV wavelengths for faint sources
    (Genmag~33, ~13 mag above faint MAGREF limit).
  fix: Updated SNANA kcor program with SNR validation checks for Poisson noise dependence
    on magnitude and exposure time. Updated simulation to skip wavelength bins with
    negative variance solutions. Use brighter MAGREF range (19-25 instead of 15-20)
    to cover useful redshift ranges and avoid pathological solutions. Always read
    wavelength bin values explicitly rather than assuming perfect grid due to missing
    bins.
  scope: universal
  status: unverified
  source: 'GitHub Issue #125'
- id: duplicate-simgen-infile-ia-key-sim-snmix
  symptom: 'FATAL ERROR ABORT: "Must specify sim-input file for Ia and/or NON1A. Add
    1 or more of the following keys: SIMGEN_INFILE_Ia, SIMGEN_INFILE_SNIa, SIMGEN_INFILE_NONIa"
    when running sim_SNmix.pl with multiple GENVERSIONs that each have different SIMGEN_INFILE_Ia
    values.

    '
  cause: 'sim_SNmix.pl required a global SIMGEN_INFILE_Ia key in the master input
    file even though individual GENVERSIONs each specified their own SIMGEN_INFILE_Ia
    keys. The global key was redundant and confusing since outputs followed the individual
    GENVERSION specifications, not the global value.

    '
  fix: 'Removed the requirement for a global SIMGEN_INFILE_Ia key in the master input
    file. Users can now omit it when using multiple GENVERSIONs with individual SIMGEN_INFILE_Ia
    specifications.

    '
  scope: universal
  status: verified
  source: 'GitHub Issue #74'
- id: salt2mu-subprocess-beta-linearly-decreasing
  symptom: Fitted beta value decreases linearly at each SALT2mu subprocess iteration
    for Dust2Dust. Number of events (EVT) used in fit also decreases. Process eventually
    crashes with segmentation fault in MNCHI2FUN during fit execution at iteration
    ~96.
  cause: GENPDF weights being applied cumulatively at each iteration instead of using
    only the new GENPDF weight. Previously commented-out line in SALT2mu.c that handles
    CUTMASK_LIST[CUTBIT_SPLITRAN] was causing the cumulative weight application. Additionally,
    GENPDF subsampling from previous iterations was not being reinitialized, causing
    the subsample pool to shrink with each iteration.
  fix: Restore the previously commented line in SALT2mu.c that resets cut bits related
    to CUTMASK_LIST[CUTBIT_SPLITRAN] to prevent cumulative GENPDF weight application.
    Ensure GENPDF weights are recalculated fresh at each iteration rather than accumulated.
    Set REPEAT flag to false in exec_mnparm() to force all initialization to be redone
    for each subprocess iteration.
  scope: universal
  status: unverified
  source: 'GitHub Issue #1613'
- id: ccdnum-removed-from-varlist
  symptom: 'FATAL ERROR ABORT called by rd_sntextio_varlist_obs

    Invalid varName = CCDNUM (ivar=16 of 18)

    Check VARLIST args.

    Program aborts when reading data files containing CCDNUM column instead of DETNUM.

    '
  cause: 'August 2025 commit replaced all instances of CCDNUM with DETNUM in the SNANA
    variable list.

    While sim code was updated to accept both CCDNUM and DETNUM in SIMLIB/cadence
    files,

