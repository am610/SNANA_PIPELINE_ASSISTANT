    determined from the first SED file read.

    '
  cause: 'SED files in the SIMSED model directory have inconsistent and vastly different
    DAY ranges.

    Some SED files cover days 51-89, while others cover days 1565-4148.

    SNANA determines the expected NDAY from the largest SED file, then aborts when
    encountering SED files with different NDAY values.

    SED DAY ranges outside the acceptable limits of -500 to 1500 days cause the mismatch.

    '
  fix: 'Revise all SED time series in the SIMSED model directory to have consistent
    DAY ranges within the limits of -500 to 1500 days.

    Ensure all SED files in a single SIMSED model have similar day ranges as SIMSED
    models were intended to have.

    '
