    column is provided.

    When HOSTLIB_MSKOPT includes option 16 (or 536 in test case), the simulation attempts
    to use galaxy redshift

    but fails because ZTRUE is a mandatory variable that is checked before allowing
    ZTRUE_CMB as an alternative.

    '
  fix: 'Implement optional ZTRUE_CMB column in HOSTLIB such that if ZTRUE_CMB is provided
    without ZTRUE,

    the simulation internally constructs the heliocentric ZTRUE column from ZTRUE_CMB
