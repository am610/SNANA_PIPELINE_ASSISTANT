  cause: SPEC_FILE and zHOST map codes are independent with non-overlapping capabilities.
    SPEC_FILE map supports ad-hoc color definitions while zHOST map only supports
    explicit HOSTLIB variables and cannot compute ad-hoc colors. The two code paths
    do not share a common interface for color handling.
  fix: Refactored searcheff map code in v12_01e merges SPEC and zHOST-map code into
    single SEARCHEFF_MAP_DEF object using REFAC_SEARCHEFF_MAP=1 flag. Requires restructuring
    sntools_trigger.c[h] and sntools_host.c[h] to read HOSTLIB variables before SPEC/zHOST/GENPDF
    checks and splitting read_head_HOSTLIB() into read_head_HOSTLIB and prep_head_HOSTLIB
    functions.
