name: Publish container image

# Builds the Dockerfile and pushes to GitHub Container Registry (GHCR) so
# `docker pull ghcr.io/am610/snana-pipeline-assistant` works for anyone,
# without them cloning the repo or building it themselves — see ROADMAP.md
# "Platform independence" audit, 2026-08-21.
#
# Uses the automatic GITHUB_TOKEN (no personal API key needed here, unlike
# the Phase 2(a) ingestion workflow) — GHCR authenticates against the repo
# itself for a public repo's own Actions runs.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "src/**"
      - "knowledge/**"
      - "skill/**"
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/am610/snana-pipeline-assistant

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
