name: Publish to PyPI

# Builds the sdist + wheel and publishes them to PyPI as `isnana` using
# PyPI Trusted Publishing (OIDC) -- no API token is stored in the repo.
#
# One-time setup on pypi.org (Account -> Publishing -> Add a pending publisher):
#   PyPI project name : isnana
#   Owner             : am610
#   Repository name    : SNANA_PIPELINE_ASSISTANT
#   Workflow filename  : release.yml
#   Environment name   : pypi
#
# To cut a release after that:
#   1. Bump `version` in pyproject.toml and `__version__` in
#      src/snana_assistant/__init__.py (they must match), update CHANGELOG.md.
#   2. git tag v0.3.2 && git push origin v0.3.2   (tag must be v<version>)
#   The tag push triggers this workflow; the GitHub Release is optional.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Sync packaged knowledge base from knowledge/
        run: |
          python scripts/sync_package_data.py
          python scripts/sync_package_data.py --check

      - name: Verify version tag matches package metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYPROJECT=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          INIT=$(python -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('src/snana_assistant/__init__.py').read()).group(1))")
          echo "tag=$TAG pyproject=$PYPROJECT __init__=$INIT"
          test "$TAG" = "$PYPROJECT" || { echo "::error::tag v$TAG != pyproject.toml version $PYPROJECT"; exit 1; }
          test "$TAG" = "$INIT" || { echo "::error::tag v$TAG != __init__.py __version__ $INIT"; exit 1; }

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Only publish for real tag pushes, not manual dry-runs.
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/isnana
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
