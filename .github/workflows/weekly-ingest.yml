name: Weekly Ingestion Sync

on:
  schedule:
    # Run every Sunday at midnight
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    # Required: this repo's default GITHUB_TOKEN permission is "read" (checked
    # via `gh api repos/.../actions/permissions/workflow`), so without this
    # block the "Create Pull Request" step below 403s the first time it
    # actually tries to push a branch and open a PR.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[all]

      - name: Run sync script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 knowledge/sync_new_issues.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Weekly sync: ingest newly-closed failure modes"
          title: "Weekly Ingest: New Unverified Failure Modes"
          body: |
            Automated ingestion sync completed. 
            
            This PR adds newly-closed issues from `RickKessler/SNANA` that match the high-signal threshold criteria as `status: unverified` entries.
            
            ### Actions required:
            1. Review new entries in `knowledge/entries.yaml` for correctness.
            2. Run evaluation harness: `python3 eval/run_eval.py` to confirm no regressions.
            3. Promote verified entries using `snana-assistant promote <id>`.
          branch: "weekly-ingest-sync"
          delete-branch: true
          labels: "unverified-failure"
