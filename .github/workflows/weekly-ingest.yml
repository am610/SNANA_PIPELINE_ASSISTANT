name: Weekly knowledge base ingestion

# Phase 2(a): finds newly-closed issues on RickKessler/SNANA since the last
# run, summarizes high-signal ones into entries.yaml as status: unverified,
# and opens a PR (review gate before anything is trusted/promoted -- see
# ROADMAP.md Phase 2).
#
# Requires an ANTHROPIC_API_KEY repo secret (Ayan's decision, 2026-08-21: reuse
# his existing key, accepted it bills his account for these runs indefinitely).
# This workflow will fail at the "Run sync" step until that secret exists --
# expected, not a bug; adding it is a manual step only a repo admin can do.

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[anthropic]"

      - name: Run sync
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python knowledge/sync_new_issues.py

      - name: Open PR if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Weekly knowledge base sync: newly-closed SNANA issues"
          title: "Weekly ingestion: new unverified entries from closed SNANA issues"
          body: |
            Automated Phase 2(a) run. New entries (if any) are added as
            `status: unverified` -- review before promoting, per the
            review-gated design in `ROADMAP.md` Phase 2.
          branch: auto/weekly-issue-sync
          labels: unverified-failure
