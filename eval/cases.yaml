# Eval harness seed cases. Each case pairs a realistic user query against the
# knowledge-base entry it should surface. This is intentionally small (8, one per
# seed KB entry) — target is 15-20 per ROADMAP.md; the rest should come from real
# incidents in sessions_log.md and, later, the SNANA GitHub issue corpus (see
# ROADMAP.md Phase 1.5) rather than more synthetic cases like these.
#
# Not run automatically yet — no runner script exists. Next step: a small script
# that calls Agent.diagnose() per case and checks whether the expected entry id
# was cited in the response.

- query: >
    My RERUN batch job for LCFIT has been running for 18 hours and the log just
    keeps saying "Wait for ['BUSY_MERGE_CPU0014.LOCK'] to clear" over and over.
    Nothing is actually getting fit.
  expected_entry: stale-busy-merge-lock

- query: >
    Merge log says FATAL ERROR ABORT: Missing expected
    PIP_XYZ-0018/FITOPT018.FITRES but MERGE.LOG shows that version as DONE.
  expected_entry: missing-fitres-after-merge-abort

- query: >
    BBC is aborting and mentions sigint. I tried adding sigint_fix to my SALT2mu
    input but it still fails.
  expected_entry: sigint-abort-bbc

- query: >
    snlc_fit.exe aborts complaining it can't find the SALT2 probability density
    files.
  expected_entry: missing-salt2-pdf

- query: >
    My sim keeps rejecting almost every host in the HOSTLIB during matching and
    I don't understand why.
  expected_entry: hostlib-dztol-too-tight

- query: >
    I gave my sim a long descriptive GENVERSION name and now the actual output
    directory doesn't match what I specified.
  expected_entry: genversion-truncation

- query: >
    I resubmitted a Pippin stage under a new name but it seems to be silently
    reusing results from an old, unrelated run.
  expected_entry: slurm-jobname-truncation-collision

- query: >
    I fixed a typo in my sim input YAML but Pippin fails the exact same way it
    did before the fix.
  expected_entry: stale-cached-yaml

- query: >
    My simulation crashed mid-run with an abort called by GEN_SNHOST_DDLR
    complaining about a "Crazy SN-galaxy sep = 1841.1 arcsec". I tried to increase
    the job memory limit to 20GB but it still fails the exact same way.
  expected_entry: hostlib-nbrlist-crazy-sep

- query: >
    I notice that some of the rows in my simulation dump file end with 3 integers,
    but other rows end with only 2 integers. This misalignment seems to cause
    NaNs in my FLAG_ACCEPT column.
  expected_entry: dump-alignment-mismatch

- query: >
    I have an LCFIT job that runs successfully but later causes errors in BBC
    because some SNe make it through with zHEL=0 (fitted redshift of 0). This
    happens in my photo-z fit runs.
  expected_entry: negative-redshift-lcfit-photoz

- query: >
    My Pippin analysis run fails during the SuperNNovaClassifier stage. The log
    shows "ValueError: shape mismatch: value array of shape (26,9) could not be
    broadcast to indexing result of shape (1,26)" during HDF5 loading.
  expected_entry: snn-classifier-filter-naming-mismatch

- query: >
    My light curve simulation is crashing with a segmentation violation. The
    stack trace shows the crash occurs at INTEG_zSED_SALT2 called from
    genSpec_SALT2 after the "Begin Generating Lightcurves" message.
  expected_entry: segfault-lightcurve-generation-uninitialized-mwxt-table

- query: >
    My simulation aborts after the message "Begin Generating Lightcurves."
    with a stack smashing error and core dumped: "*** stack smashing detected ***: <unknown> terminated".
  expected_entry: stack-smashing-sample-input-files

- query: >
    I'm running a bias correction for ATLAS and the job aborts in get_BININFO_biasCor_abg
    saying SIM_alpha values exceeds bound of 2. I specified GENSIGMA_SALT2ALPHA: 0 0
    but it still fails.
  expected_entry: sim-alpha-beta-delta-function-numerical-artifact

- query: >
    My simulation aborted with interp_GALMAG_HOSTLIB error saying g-PSFSIG is outside valid range.
  expected_entry: psfsig-outside-valid-range-abort

- query: >
    FATAL ERROR: CIDRAN_MAX exceeds MXCID_SIM limit of 299999999 in init_CIDRAN during a large simulation.
  expected_entry: cidran-exceeds-sim-limit

- query: >
    Light curve fitting crashes with NROW exceeds bound MXSNLC in RDVERSION_FITS.
  expected_entry: mxsnlc-fitting-limit-exceeded

- query: >
    GEN_SNHOST_DDLR aborts with invalid cosTH = -1.000000 for GALID entries.
  expected_entry: host-ddlr-numerical-roundoff-costheta

- query: >
    Relative file paths like $SNANA_DEBUG do not resolve correctly with the new submission script.
  expected_entry: relative-paths-submission-script

