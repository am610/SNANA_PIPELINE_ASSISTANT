- id: stale-busy-merge-lock
  symptom: 'LOG shows "Wait for [''BUSY_MERGE_CPUXXXX.LOCK''] to clear" repeated for
    hours, then "CANCELLED ... DUE TO TIME LIMIT". Zero fitting occurs despite the
    job running its full walltime.

    '
  cause: 'A prior merge crash or kill left a BUSY_MERGE_CPU*.LOCK file in output/.
    The resubmitted job''s CMD calls --merge after each fit and waits indefinitely
    for the stale lock.

    '
  fix: 'Before resubmitting any RERUN batch: rm -f output/BUSY_MERGE_CPU*.LOCK'
  scope: universal
  status: verified
  source: EUCLID_LSST_DDF_V4_PHOTOZ FIT_DATA_EUCLID_PHZ, 2026-06-09
- id: missing-fitres-after-merge-abort
  symptom: '"FATAL ERROR ABORT: Missing expected PIP_...-00XX/FITOPTYYY.FITRES" in
    the merge log.

    '
  cause: 'A merge attempt aborted mid-way (stale lock, truncated FITRES, allocation
    kill). The merge driver marked the version/FITOPT DONE in MERGE.LOG but never
    wrote the final merged FITRES file.

    '
  fix: "1) Verify raw FITRES.TEXT is intact: grep -c '^SN:' <VERSION>_FITOPTYYY_SPLIT001.FITRES.TEXT\
    \ 2) If intact, rebuild: cat <PREFIX>_FITOPTYYY*FITRES.TEXT > /tmp/MERGE_tmp.FITRES;\n\
    \   awk '!/^VARNAMES/ || ++n <= 1' /tmp/MERGE_tmp.FITRES > /tmp/MERGE2_tmp.FITRES;\n\
    \   cp /tmp/MERGE2_tmp.FITRES ../PIP_...-00XX/FITOPTYYY.FITRES\n3) Truncate the\
    \ FATAL ERROR from MERGE.LOG, delete ALL.DONE, run MERGE_LAST.\n"
  scope: universal
  status: verified
  source: -0018/FITOPT018.FITRES, 2026-06-09
- id: sigint-abort-bbc
  symptom: BBC (SALT2mu) aborts citing sigint.
  cause: Attempting to use a nonexistent 'sigint_fix' option.
  fix: "Use sigmb_biascor, not sigint_fix \u2014 the latter does not exist."
  scope: universal
  status: verified
  source: pipeline-debug checklist / project ground rules
- id: missing-salt2-pdf
  symptom: LCFIT/sim aborts referencing missing SALT2 probability-density files.
  cause: SALT2_INFO path in the sim input file is wrong or the PDF files aren't at
    that path.
  fix: Verify SALT2_INFO path in the sim input file against what's actually on disk.
  scope: universal
  status: verified
  source: pipeline-debug checklist / project ground rules
- id: hostlib-dztol-too-tight
  symptom: HOSTLIB-related aborts or excessive event rejection during host matching.
  cause: HOSTLIB_DZTOL tolerance set too tight for the redshift precision in the HOSTLIB.
  fix: Loosen HOSTLIB_DZTOL in the HOSTLIB config.
  scope: universal
  status: verified
  source: pipeline-debug checklist / project ground rules
- id: genversion-truncation
  symptom: Sim runs under a different effective GENVERSION than specified, or two
    long-named runs collide.
  cause: GENVERSION strings are silently truncated at ~72 characters.
  fix: Keep GENVERSION names short; check for truncation collisions with long descriptive
    names.
  scope: universal
  status: verified
  source: Bailey+2022 reproduction session, 2026-08-16
- id: slurm-jobname-truncation-collision
  symptom: Pippin reruns appear to silently reuse/interfere with a prior job.
  cause: 'Slurm job names are truncated at ~8 characters; two differently-named Pippin
    jobs can collide after truncation.

    '
  fix: Check squeue -u $USER for duplicate truncated names before assuming a config/code-level
    failure.
  scope: slurm
  status: verified
  source: pipeline-debug checklist, step 1
- id: stale-cached-yaml
  symptom: A config fix is made but the pipeline still fails the same way.
  cause: 'Pippin copies YAMLs into its output staging directory at runtime; a source-YAML
    fix isn''t picked up if a prior copy was already cached for that stage.

    '
  fix: "diff <source_yaml> <pippin_output_dir>/<stage>/<cached_yaml> \u2014 if they\
    \ differ, fix the cached copy directly or force a rerun of that stage.\n"
  scope: universal
  status: verified
  source: "pipeline-debug checklist, step 2 \u2014 most common false 'the fix didn't\
    \ work' report"
- id: hostlib-nbrlist-crazy-sep
  symptom: 'Simulation fails/aborts mid-run with "FATAL ERROR ABORT called by GEN_SNHOST_DDLR"
    and "Crazy SN-galaxy sep = X arcsec for i_nbr=0 ... Likely a problem with NBR_LIST"
    in the log.

    '
  cause: 'Manually deleting or editing rows in a HOSTLIB file that contains pre-computed
    NBR_LIST columns. The row offsets in NBR_LIST point to the wrong rows after deletions,
    leading to corrupted galaxy matching.

    '
  fix: 'Do not manually edit a HOSTLIB with NBR_LIST. Edit the original host catalog
    (without NBR_LIST), remove the bad rows, and then run `snlc_sim.exe NOFILE HOSTLIB_FILE
    <hostlib> +HOSTNBR` to regenerate the NBR_LIST columns.

    '
  scope: universal
  status: verified
  source: 'GitHub Issue #1637'
- id: dump-alignment-mismatch
  symptom: 'Simulation dump files contain misaligned columns (e.g., some rows end
    with 3 integers while others end with 2 integers), leading to NaNs or corrupt
    values in columns like FLAG_ACCEPT.

    '
  cause: 'Mixing SIMGEN_DUMPALL (typically used for Ia) and SIMGEN_DUMP (typically
    used for non-Ia) across different simulation input files within the same Pippin
    job. This outputs a different number of variables, causing Pippin''s dump merge
    step to misalign columns.

    '
  fix: 'Ensure all simulation input files within the same Pippin job use the same
    dump configuration (either SIMGEN_DUMPALL or SIMGEN_DUMP) and output identical
    variables.

    '
  scope: universal
  status: verified
  source: 'GitHub Issue #1618'
- id: negative-redshift-lcfit-photoz
  symptom: SNe passing LCFIT with fitted redshift z=0 (or negative zCMB) when using
    photo-z priors, causing downstream errors in BBC. Occurs only with LCFIT+z when
    photo-z estimates are far from true spectroscopic redshift.
  cause: Photo-z priors that are pathologically far from true redshift (e.g., photo-z~0.2
    when zSpec~0.8) result in degenerate fits where stretched parameters absorb the
    redshift difference, allowing unphysical fitted z=0 solutions. Default PRIOR_ZERRSCALE=1000
    effectively flattens the photo-z prior, and incorrect header variable names (HOSTGAL_ZPHOT
    vs HOSTGAL_PHOTOZ) prevent proper prior application.
  fix: '1) Use correct header override variable names: HOSTGAL_PHOTOZ and HOSTGAL_PHOTOZ_ERR
    instead of HOSTGAL_ZPHOT/HOSTGAL_ZPHOTERR. 2) Set PRIOR_ZERRSCALE=1.0 (not default
    1000) when using photo-z mean/STD as prior. 3) Apply combination cuts on FITPROB,
    color, and stretch parameters to reject pathological fits. 4) Consider CUTWIN_REDSHIFT
    and FITWIN_PROB cuts, though these alone are insufficient for pathological cases.'
  scope: universal
  status: unverified
  source: 'GitHub Issue #1157'
- id: snn-classifier-filter-naming-mismatch
  symptom: 'SuperNNovaClassifier fails during Pippin analysis with ValueError during
    HDF5 loading: "shape mismatch: value array of shape (26,9) could not be broadcast
    to indexing result of shape (1,26)". Occurs when applying models trained with
    single-character filter names (g, r, i, z) to data with full filter strings (DES-g,
    DES-r, DES-i, DES-z), or vice versa.

    '
  cause: 'Recent simulation update changed filter string format from single-character
    representation (e.g., ''g'') to full filter strings (e.g., ''DES-g''). SNN models
    trained with one format fail when applied to data with the other format due to
    filter name mismatch causing shape incompatibility in feature arrays during HDF5
    data loading.

    '
  fix: '1) Ensure consistent filter naming between training and test data. In Pippin
    analysis.yml, explicitly specify LIST_FILTERS matching the data format (e.g.,
    `--list_filters g i r z` for single-char or `--list_filters DES-g DES-r DES-i
    DES-z` for full strings).

    2) For DES 5-year backward compatibility, use SuperNNova branch SNANA_DES5yr which
    includes a patch allowing models trained with single-char filters to be applied
    to DES-prefixed filter data.

    '
  scope: universal
  status: unverified
  source: 'GitHub Issue #1449'
- id: segfault-lightcurve-generation-uninitialized-mwxt-table
  symptom: 'Segmentation fault during light curve generation in INTEG_zSED_SALT2,
    occurring after ''Begin Generating Lightcurves'' message. Crash happens during
    genSpec_SALT2 call when processing redshift z~1.3. Stack trace shows: INTEG_zSED_SALT2
    -> genSpec_SALT2 -> GENSPEC_TRUE -> GENSPEC_DRIVER -> main'
  cause: fill_TABLE_MWXT_SEDMODEL() is called from genmag_SALT2 only when event has
    bands within SALT2 model range. For events with no bands in range (e.g., high-z
    events), the MWXT table is never allocated or filled. Subsequently, genSpec_SALT2
    is called and attempts to use the uninitialized MWXT table, causing a segmentation
    fault.
  fix: Call fill_TABLE_MWXT_SEDMODEL() from genSpec_SALT2 with a guard to do nothing
    if already called from genmag_SALT2. This ensures the MWXT table is always allocated
    and filled before genSpec_SALT2 uses it.
  scope: universal
  status: unverified
  source: 'GitHub Issue #1248'
